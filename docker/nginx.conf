# nginx: HLS는 디스크에서 직접 서빙(sendfile), 나머지는 FastAPI로 프록시.
# 사용: docker compose -f docker/docker-compose.yml -f docker/docker-compose.nginx.yml up -d
# 접속: http://localhost:80 (HLS: http://localhost/hls/ch1/index.m3u8, API: http://localhost/v1/...)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # HLS: 세그먼트(.ts)는 짧은 캐시, 플레이리스트(.m3u8)는 no-cache
    map $uri $hls_cache_control {
        default "";
        "~*\.m3u8$" "no-cache, no-store, must-revalidate";
        "~*\.ts$" "max-age=2, public";
    }

    server {
        listen 80;
        server_name _;

        # HLS 세그먼트/플레이리스트 — 디스크에서 직접 서빙 (stream-worker와 공유 볼륨)
        location /hls/ {
            alias /data/hls/;
            add_header Cache-Control $hls_cache_control;
            add_header Access-Control-Allow-Origin *;
            # .m3u8, .ts MIME
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        # API·헬스·기타 — FastAPI로 프록시
        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}

# 스트리밍 인프라 스택: API · Orchestrator · Stream Worker · Kafka · MySQL · Redis · UI
#
# [개발] docker compose -f docker/docker-compose.yml up -d
#   - app 코드는 volumes로 마운트됨 → 코드 수정 후 컨테이너만 재시작하면 반영 (이미지 재빌드 불필요)
# [프로덕션] docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml up -d
#   - app 마운트 없음 → 이미지에 박힌 코드로 실행 (반드시 이미지 빌드 후 배포)
#
# DB 초기화: docker exec -i streaming-mysql mysql -uroot -pdevpass streaming_pipeline_dev < app/infrastructure/persistence/migrations/001_streams_jobs_mysql.sql
services:
  nginx:
    image: nginx:alpine
    container_name: streaming-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - hls_data:/data/hls:ro
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    image: streaming-api:latest
    container_name: streaming-api
    ports:
      - "8000:8000"
    env_file: ../.env
    environment:
      - COMMAND_BUS=kafka
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HOST=mysql
      - PORT=3306
      - USERNAME=root
      - PASSWORD=devpass
      - DBNAME=streaming_pipeline_dev
      - TZ=Asia/Seoul
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    volumes:  # 개발: 코드 마운트. 프로덕션은 docker-compose.prod.yml 로 오버라이드
      - ../app:/app/app:ro
      - hls_data:/data/hls  # HLS 세그먼트 서빙 (stream-worker와 공유)

  orchestrator:
    build:
      context: ..
      dockerfile: docker/orchestrator.Dockerfile
    image: streaming-orchestrator:latest
    container_name: streaming-orchestrator
    ports:
      - "9090:9090"
    env_file: ../.env
    environment:
      - ASSIGNED_WORKER_ID=stream-worker-1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOST=mysql
      - PORT=3306
      - USERNAME=root
      - PASSWORD=devpass
      - DBNAME=streaming_pipeline_dev
      - TZ=Asia/Seoul
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    volumes:  # 개발: 코드 마운트. 프로덕션은 docker-compose.prod.yml 로 오버라이드
      - ../app:/app/app:ro

  stream-worker:
    build:
      context: ..
      dockerfile: docker/worker-stream.Dockerfile
    image: streaming-worker-stream:latest
    container_name: streaming-stream-worker
    ports:
      - "9091:9091"
    # 호스트/PC에서 올린 RTSP 접속용 (예: rtsp://host.docker.internal:554/stream)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: ../.env
    environment:
      - WORKER_ID=stream-worker-1
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - HOST=mysql
      - PORT=3306
      - USERNAME=root
      - PASSWORD=devpass
      - DBNAME=streaming_pipeline_dev
      - TZ=Asia/Seoul
      - HLS_OUTPUT_DIR=/data/hls
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      mysql: { condition: service_healthy }
    volumes:  # 개발: 코드 마운트. 프로덕션은 docker-compose.prod.yml 로 오버라이드
      - ../app:/app/app:ro
      - hls_data:/data/hls

  infer-worker:
    build:
      context: ..
      dockerfile: docker/worker-infer.Dockerfile
    image: streaming-worker-infer:latest
    container_name: streaming-infer-worker
    env_file: ../.env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Seoul
    depends_on:
      - kafka
      - redis
    volumes:  # 개발: 코드 마운트. 프로덕션은 docker-compose.prod.yml 로 오버라이드
      - ../app:/app/app:ro

  mysql:
    image: mysql:8.0
    container_name: streaming-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: devpass
      MYSQL_DATABASE: streaming_pipeline_dev
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevpass"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: streaming-redis
    ports:
      - "6379:6379"

  ui:
    build:
      context: ..
      dockerfile: docker/ui-streamlit.Dockerfile
    image: streaming-ui:latest
    container_name: streaming-ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://api:8000
      # 브라우저가 m3u8 요청을 보내므로 호스트에서 접근 가능한 주소 사용 (API는 8000으로 노출)
      - HLS_BASE_URL=http://localhost/hls
    depends_on:
      - api

  kafka:
    image: apache/kafka:latest
    container_name: streaming-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 바인딩: 모든 인터페이스(다른 컨테이너 접속용). 광고 주소: Docker 네트워크에서 kafka:9092로 접속
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # 토픽 미리 생성 → orchestrator/stream-worker 시작 시 "Topic not found" 로그 방지
  kafka-init:
    image: apache/kafka:latest
    container_name: streaming-kafka-init
    depends_on:
      kafka: { condition: service_started }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.commands --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic stream.events --partitions 1 --replication-factor 1
    restart: "no"

volumes:
  hls_data: {}  # HLS 세그먼트/플레이리스트 (stream-worker 쓰기, api 읽기)

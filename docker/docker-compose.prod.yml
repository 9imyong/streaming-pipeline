# 프로덕션용 (볼륨 마운트 없이 이미지 내 코드만 사용)
# 사용: docker compose -f docker/docker-compose.prod.yml up -d
services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: streaming-api
    ports:
      - "8000:8000"
    volumes:
      - /data:/data
      - ../tensorrt:/tensorrt
    env_file: ../.env
    environment:
      - REDIS_HOST=redis
      - NVIDIA_VISIBLE_DEVICES=0
      - TZ=Asia/Seoul
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis

  celery_worker:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: streaming-worker
    volumes:
      - /data:/data
      - ../tensorrt:/tensorrt
    env_file: ../.env
    environment:
      - REDIS_HOST=redis
      - NVIDIA_VISIBLE_DEVICES=0
      - TZ=Asia/Seoul
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis

  celery_beat:
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    container_name: streaming-beat
    command: celery -A tasks beat --loglevel=info
    env_file: ../.env
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: streaming-redis

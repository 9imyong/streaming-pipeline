apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: streaming-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: streaming-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: streaming-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: streaming-platform
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: streaming-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: streaming-orchestrator:latest
          envFrom:
            - configMapRef:
                name: streaming-config
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: streaming-platform
spec:
  selector:
    app: orchestrator
  ports: []
  type: ClusterIP

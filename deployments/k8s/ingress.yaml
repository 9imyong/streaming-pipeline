apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-ingress
  namespace: streaming-platform
spec:
  ingressClassName: nginx
  rules:
    - host: streaming.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
  # tls 생략 (필요 시 추가)
